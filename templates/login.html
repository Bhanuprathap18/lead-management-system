<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#111827;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;

        }

        .login-card{

            background:white;
            padding:40px;
            border-radius:15px;
            width:400px;
            box-shadow:0px 4px 20px rgba(0,0,0,0.3);

        }

    </style>

</head>

<body>

<div class="login-card">

    <h2 class="text-center mb-4">
        Lead CRM Login
    </h2>

    {% if error %}

    <div class="alert alert-danger">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input type="text"
                   name="username"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required>

        </div>

        <button type="submit"
                class="btn btn-dark w-100">

            Login

        </button>

    </form>

</div>

</body>
</html>
